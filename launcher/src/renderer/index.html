<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">▣</div>
      <div>
        <h1 id="app-name">런처</h1>
        <p id="pack-meta" class="muted">서버 정보를 불러오는 중...</p>
      </div>
    </div>
    <div class="topbar-right">
      <button id="link-website" class="ghost hidden">웹사이트</button>
      <button id="link-discord" class="ghost hidden">디스코드</button>
      <div id="account" class="account">
        <span id="account-name" class="muted">로그인 안 됨</span>
        <button id="login-btn" class="ghost">로그인</button>
        <button id="logout-btn" class="ghost hidden">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="notes">
      <div class="notes-header">
        <h2>패치노트</h2>
        <span id="update-badge" class="badge hidden">새 업데이트</span>
      </div>
      <div id="changelog" class="changelog">
        <p class="muted">불러오는 중...</p>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <div class="status">
      <div id="status-text">준비 중...</div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div id="version-text" class="muted small"></div>
    </div>
    <button id="settings-btn" class="ghost" title="설정">설정</button>
    <button id="play-btn" class="primary" disabled>확인 중...</button>
  </footer>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>설정</h2>
      <label>
        메모리 (RAM) <strong id="mem-value"></strong>
        <input id="mem-input" type="range" min="1024" step="512">
        <span class="muted small">PC 전체 메모리 <span id="mem-total"></span></span>
      </label>
      <label class="check">
        <input id="autoconnect-input" type="checkbox"> 게임 시작 시 서버에 자동 접속
      </label>
      <label class="check">
        <input id="hide-input" type="checkbox"> 게임 실행 중 런처 숨기기
      </label>
      <label>
        추가 JVM 인자 <span class="muted small">(모르면 비워두세요)</span>
        <input id="jvm-input" type="text" placeholder="-XX:+UseG1GC">
      </label>
      <div class="settings-actions">
        <button type="button" id="open-folder-btn" class="ghost">게임 폴더 열기</button>
        <button type="button" id="open-logs-btn" class="ghost">로그 폴더 열기</button>
        <button type="button" id="repair-btn" class="ghost">파일 검사/복구</button>
      </div>
      <div class="dialog-buttons">
        <button value="cancel" class="ghost">취소</button>
        <button id="settings-save" value="save" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
