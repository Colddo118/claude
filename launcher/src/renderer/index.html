<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 제목 줄: 인게임 창처럼 왼쪽 제목 · 오른쪽 흐린 정보 · 아래 구분선 -->
  <header class="titlebar">
    <img class="logo" src="assets/logo.png" alt="" aria-hidden="true">
    <h1 id="app-name">런처</h1>
    <p id="pack-meta" class="muted">서버 정보를 불러오는 중...</p>
  </header>

  <main class="body">
    <section class="well notes">
      <div class="well-head">
        <h2>패치노트</h2>
        <span id="update-badge" class="chip hidden">새 업데이트</span>
      </div>
      <div id="changelog" class="changelog">
        <p class="muted">불러오는 중...</p>
      </div>
    </section>

    <div class="side">
      <section class="well install">
        <div class="well-head"><h2>설치</h2><span id="progress-pct" class="pct"></span></div>
        <div id="status-text">준비 중...</div>
        <div id="status-detail" class="muted small"></div>
        <div class="progress"><div id="progress-bar"></div></div>
        <dl id="facts" class="facts hidden">
          <div><dt>버전</dt><dd id="version-text">-</dd></div>
          <div id="server-row" class="hidden"><dt>서버</dt><dd id="server-text"></dd></div>
        </dl>
      </section>

      <section class="well account-well">
        <div class="well-head"><h2>계정</h2></div>
        <div id="account" class="account">
          <div class="who">
            <span id="account-name">로그인 안 됨</span>
            <span id="account-sub" class="muted small">로그인이 필요해요</span>
          </div>
          <button id="login-btn" class="ghost">로그인</button>
          <button id="logout-btn" class="ghost hidden">로그아웃</button>
        </div>
      </section>
    </div>
  </main>

  <!-- 아랫줄: 왼쪽 보조 버튼 · 오른쪽 초록 행동 버튼 -->
  <footer class="bottombar">
    <div class="links">
      <button id="settings-btn" class="ghost" title="설정">설정</button>
      <button id="link-discord" class="ghost hidden">디스코드</button>
      <button id="link-website" class="ghost hidden">웹사이트</button>
    </div>
    <button id="play-btn" class="primary" disabled>확인 중...</button>
  </footer>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <div class="dialog-title"><h2>설정</h2><span id="launcher-version" class="muted small"></span></div>

      <section class="well">
        <div class="well-head">
          <h2>메모리 (RAM)</h2>
          <strong id="mem-value"></strong>
        </div>
        <input id="mem-input" type="range" min="1024" step="512" aria-label="메모리">
        <span class="muted small">PC 전체 메모리 <span id="mem-total"></span></span>
      </section>

      <section class="well">
        <div class="well-head"><h2>게임</h2></div>
        <label class="check">
          <input id="autoconnect-input" type="checkbox"> 게임 시작 시 서버에 자동 접속
        </label>
        <label class="check">
          <input id="hide-input" type="checkbox"> 게임 실행 중 런처 숨기기
        </label>
        <label class="field">
          <span>추가 JVM 인자 <span class="muted">(모르면 비워두세요)</span></span>
          <input id="jvm-input" type="text" placeholder="-XX:+UseG1GC">
        </label>
      </section>

      <div class="settings-actions">
        <button type="button" id="open-folder-btn" class="ghost">게임 폴더 열기</button>
        <button type="button" id="open-logs-btn" class="ghost">로그 폴더 열기</button>
        <button type="button" id="repair-btn" class="ghost">파일 검사/복구</button>
      </div>
      <div class="dialog-buttons">
        <button value="cancel" class="ghost">취소</button>
        <button id="settings-save" value="save" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
