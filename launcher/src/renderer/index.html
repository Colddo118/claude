<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 필드 보스 창(Q3) 문법: 창 가득 보스 그림 · 왼쪽 위 금색 제목 · 오른쪽 위 글자 탭 · 왼쪽 정보 · 오른쪽 아래 버튼 -->
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="assets/logo.png" alt="" aria-hidden="true">
      <span class="brand-name">모드팩 런처</span>
    </div>
    <nav class="tabs">
      <span id="account-name" class="muted">로그인 안 됨</span>
      <button id="login-btn" class="tab">로그인</button>
      <button id="logout-btn" class="tab hidden">로그아웃</button>
      <button id="link-website" class="tab hidden">웹사이트</button>
      <button id="link-discord" class="tab hidden">디스코드</button>
    </nav>
  </header>

  <main class="hero">
    <p id="pack-meta" class="meta">서버 정보를 불러오는 중...</p>
    <h1 id="app-name">런처</h1>
    <div class="install">
      <div id="status-text">준비 중...</div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div id="version-text" class="muted small"></div>
    </div>

    <section class="notes">
      <div class="notes-head">
        <h2>패치노트</h2>
        <span id="update-badge" class="chip hidden">새 업데이트</span>
      </div>
      <div id="changelog" class="changelog">
        <p class="muted">불러오는 중...</p>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <button id="settings-btn" class="ghost" title="설정">설정</button>
    <button id="play-btn" class="primary" disabled>확인 중...</button>
  </footer>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <div class="dialog-title"><h2>설정</h2></div>

      <section class="well">
        <div class="well-head">
          <h2>메모리 (RAM)</h2>
          <strong id="mem-value"></strong>
        </div>
        <input id="mem-input" type="range" min="1024" step="512" aria-label="메모리">
        <span class="muted small">PC 전체 메모리 <span id="mem-total"></span></span>
      </section>

      <section class="well">
        <div class="well-head"><h2>게임</h2></div>
        <label class="check">
          <input id="autoconnect-input" type="checkbox"> 게임 시작 시 서버에 자동 접속
        </label>
        <label class="check">
          <input id="hide-input" type="checkbox"> 게임 실행 중 런처 숨기기
        </label>
        <label class="field">
          <span>추가 JVM 인자 <span class="muted">(모르면 비워두세요)</span></span>
          <input id="jvm-input" type="text" placeholder="-XX:+UseG1GC">
        </label>
      </section>

      <div class="settings-actions">
        <button type="button" id="open-folder-btn" class="ghost">게임 폴더 열기</button>
        <button type="button" id="open-logs-btn" class="ghost">로그 폴더 열기</button>
        <button type="button" id="repair-btn" class="ghost">파일 검사/복구</button>
      </div>
      <div class="dialog-buttons">
        <button value="cancel" class="ghost">취소</button>
        <button id="settings-save" value="save" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
